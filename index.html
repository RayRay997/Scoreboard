<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="title">HOME</h3>
                <span id="score-Home">0</span>
                <div class="points">
                    <button class="button" onclick="homePlus1()">+1</button>
                    <button class="button" onclick="homePlus2()">+2</button>
                    <button class="button" onclick="homePlus3()">+3</button>
                </div>
            </div>
            <div>
                <h3 class="title">AWAY</h3>
                <span id="score-Guest">0</span>
                <div class="points">
                    <button  class="button" onclick="guestPlus1()">+1</button>
                    <button  class="button" onclick="guestPlus2()">+2</button>
                    <button  class="button" onclick="guestPlus3()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
